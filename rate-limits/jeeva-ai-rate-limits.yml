note: >-
  Jeeva AI publishes no API rate limits, because it publishes no public API. The API host
  api.jeeva.ai is an AWS API Gateway that answers 403 {"message":"Missing Authentication
  Token"} on every path probed, and there is no developer portal or API reference to carry
  limits. No X-RateLimit-*, RateLimit-* or Retry-After header contract is documented
  anywhere on the public surface. The product-level throughput controls below are recorded
  because they are the only published limits, but they are user-configured application
  settings on a connected mailbox, not an API rate limit, so limit_count stays 0.
