product_throughput_controls:
- name: Daily Email Limit
  scope: per connected inbox
  window: day
  limit: user-configured
  description: >-
    Maximum number of emails Jeeva may send from a connected inbox per day. Set by the
    user; bounded in practice by the sending limits of the underlying provider (Gmail,
    Outlook), not by Jeeva.
  source: https://www.jeeva.ai/doc-articles/daily-sending-limit
- name: Sending Limit Increase (warm-up)
  scope: per connected inbox
  window: day
  limit: user-configured increment
  description: >-
    A per-day increment that raises the daily email limit gradually (e.g. start at 20/day
    with an increase of 1 to reach 21, then 22) to build sender reputation.
  source: https://www.jeeva.ai/doc-articles/daily-sending-limit
- name: Credit metering
  scope: per account
  window: billing period
  limit: plan credit balance
  description: >-
    Enrichment and campaign enrolment consume credits (1 credit per email enrichment,
    2 per verified phone, 6 per campaign enrolment). Exhaustion surfaces in the app as an
    "insufficient credits" error, not as an HTTP status.
  source: https://www.jeeva.ai/doc-articles/credits-billing-101
